<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Thông tin cá nhân - Khách hàng">
    <title>Thông tin cá nhân - Travel Viet</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/admin-dashboard.css">
    <link rel="stylesheet" href="css/customer-profile.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Toastify CSS -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="admin-logo">
                <img src="img/Logo.png" alt="Logo">
                <div class="admin-logo-text">
                    <h2>Travel Viet</h2>
                    <p>Khách hàng</p>
                </div>
            </div>
            
            <!-- User Info Section in Sidebar -->
            <div class="sidebar-user-section">
                <div class="sidebar-user-avatar" id="sidebar-user-avatar">KH</div>
                <div class="sidebar-user-info">
                    <div class="sidebar-user-name" id="sidebar-user-name">Khách Hàng</div>
                    <div class="sidebar-user-email" id="sidebar-user-email">customer@travelviet.com</div>
                </div>
            </div>
            
            <nav>
                <ul class="admin-menu">
                    <li class="admin-menu-item">
                        <a href="customer-dashboard.html" class="admin-menu-link">
                            <span class="admin-menu-icon">📊</span>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li class="admin-menu-item">
                        <a href="customer-bookings.html" class="admin-menu-link">
                            <span class="admin-menu-icon">📋</span>
                            <span>Đặt tour của tôi</span>
                        </a>
                    </li>
                    <li class="admin-menu-item">
                        <a href="customer-profile.html" class="admin-menu-link active">
                            <span class="admin-menu-icon">👤</span>
                            <span>Thông tin cá nhân</span>
                        </a>
                    </li>
                    <li class="admin-menu-item">
                        <a href="customer-reviews.html" class="admin-menu-link">
                            <span class="admin-menu-icon">⭐</span>
                            <span>Đánh giá của tôi</span>
                        </a>
                    </li>
                    <li class="admin-menu-item">
                        <a href="index.html" class="admin-menu-link">
                            <span class="admin-menu-icon">🏠</span>
                            <span>Về trang chủ</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <main class="admin-main">
            <!-- Top Header -->
            <header class="admin-top-header">
                <div class="header-left">
                    <div class="header-title-section">
                        <div class="header-subtitle">Khách hàng</div>
                        <h1 class="page-title">Thông tin cá nhân</h1>
                    </div>
                </div>
                <div class="header-right">
                    <div class="header-user-card">
                        <div class="header-user-avatar" id="header-user-avatar">KH</div>
                        <div class="header-user-info">
                            <div class="header-user-name" id="header-user-name">Khách Hàng</div>
                            <div class="header-user-email" id="header-user-email">customer@travelviet.com</div>
                        </div>
                    </div>
                    <button class="logout-button" onclick="logout()">
                        <span class="logout-icon">🚪</span>
                        <span>Đăng xuất</span>
                    </button>
                </div>
            </header>

            <div class="dashboard-section">
                <h2 class="section-title">Thông tin tài khoản</h2>
                <form id="profile-form" class="profile-form" onsubmit="saveProfile(event)">
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label required" for="ho-ten">Họ tên</label>
                            <input type="text" id="ho-ten" class="form-input" required placeholder="Nhập họ tên">
                        </div>
                        <div class="form-group">
                            <label class="form-label required" for="email">Email</label>
                            <input type="email" id="email" class="form-input" required placeholder="Nhập email" readonly>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="so-dien-thoai">Số điện thoại</label>
                            <input type="tel" id="so-dien-thoai" class="form-input" placeholder="Nhập số điện thoại">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="dia-chi">Địa chỉ</label>
                            <input type="text" id="dia-chi" class="form-input" placeholder="Nhập địa chỉ">
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="cta-button cta-primary">💾 Lưu thông tin</button>
                    </div>
                </form>
            </div>

            <div class="dashboard-section">
                <h2 class="section-title">Đổi mật khẩu</h2>
                <form id="change-password-form" class="profile-form" onsubmit="changePassword(event)">
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label required" for="current-password">Mật khẩu hiện tại</label>
                            <input type="password" id="current-password" class="form-input" required placeholder="Nhập mật khẩu hiện tại">
                        </div>
                        <div class="form-group">
                            <label class="form-label required" for="new-password">Mật khẩu mới</label>
                            <input type="password" id="new-password" class="form-input" required placeholder="Nhập mật khẩu mới (tối thiểu 6 ký tự)" minlength="6">
                        </div>
                        <div class="form-group">
                            <label class="form-label required" for="confirm-password">Xác nhận mật khẩu mới</label>
                            <input type="password" id="confirm-password" class="form-input" required placeholder="Nhập lại mật khẩu mới" minlength="6">
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="cta-button cta-primary">🔑 Đổi mật khẩu</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="js/api-config.js"></script>
    <script src="js/auth-helper.js"></script>
    <script src="js/customer-profile.js"></script>
    <!-- Toastify JS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
</body>
</html>
